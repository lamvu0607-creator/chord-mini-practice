worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 110m;

    # Requests arrive from the Docker gateway (tailscale serve/funnel on the host),
    # so rate limits must key on the client IP that Tailscale forwards.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map "$request_method:$uri" $heavy_limit_key {
        default "";
        ~^POST:/api/(extract-audio|detect-beats|recognize-chords|transcribe|stems/jobs|stems/upload) $binary_remote_addr;
    }

    limit_req_zone $heavy_limit_key zone=heavy_api:10m rate=4r/m;
    limit_req_zone $binary_remote_addr zone=read_api:10m rate=120r/m;
    # PINs are 4-8 digits with no lockout, so throttle guesses hard.
    limit_req_zone $binary_remote_addr zone=auth_api:10m rate=5r/m;

    # Keep https when TLS is terminated upstream by tailscale serve/funnel.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # Re-resolve through Docker DNS so a recreated frontend container (new IP)
        # does not leave nginx proxying to a stale address.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frontend_upstream http://frontend:3000;

        location ~ ^/api/(extract-audio|detect-beats|recognize-chords|transcribe|stems/jobs|stems/upload) {
            limit_req zone=heavy_api burst=2 nodelay;
            limit_req zone=read_api burst=30 nodelay;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        location ~ ^/api/auth/(login|change-pin) {
            limit_req zone=auth_api burst=3 nodelay;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /api/ {
            limit_req zone=read_api burst=30 nodelay;
            proxy_pass $frontend_upstream;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Frontend
        location / {
            proxy_pass $frontend_upstream;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
