# ChordMiniApp Docker Compose Configuration
# Builds the frontend and backend images from this checkout.

name: chordminiapp

services:
  # Frontend - Next.js Application
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
    container_name: chordmini-frontend
    expose:
      - "3000"
    volumes:
      - frontend-audio:/app/storage/audio
      - frontend-db:/app/storage/db
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_TELEMETRY_DISABLED=${NEXT_TELEMETRY_DISABLED:-1}
      - NEXT_PUBLIC_YOUTUBE_API_KEY=${NEXT_PUBLIC_YOUTUBE_API_KEY:-}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      - NEXT_PUBLIC_AUDIO_STRATEGY=${NEXT_PUBLIC_AUDIO_STRATEGY:-auto}
      - NEXT_PUBLIC_AUDIO_STORAGE_PROVIDER=${NEXT_PUBLIC_AUDIO_STORAGE_PROVIDER:-local}
      - LOCAL_AUDIO_STORAGE_DIR=${LOCAL_AUDIO_STORAGE_DIR:-/app/storage/audio}
      - LOCAL_AUDIO_MAX_UPLOAD_MB=${LOCAL_AUDIO_MAX_UPLOAD_MB:-100}
      - LOCAL_AUDIO_QUOTA_GB=${LOCAL_AUDIO_QUOTA_GB:-20}
      - SQLITE_DATABASE_PATH=${SQLITE_DATABASE_PATH:-/app/storage/db/chordmini.sqlite}
      - INTERNAL_FRONTEND_URL=http://frontend:3000
      - NEXT_PUBLIC_ENABLE_SERVICE_WORKER=${NEXT_PUBLIC_ENABLE_SERVICE_WORKER:-false}
      - NEXT_PUBLIC_ENABLE_TRUE_STREAMING=${NEXT_PUBLIC_ENABLE_TRUE_STREAMING:-false}
      - NEXT_DISABLE_DEV_OVERLAY=${NEXT_DISABLE_DEV_OVERLAY:-true}
      - PYTHON_API_URL=${PYTHON_API_URL:-http://backend:8080}
      # Backend URL used by the app's API health check.
      - NEXT_PUBLIC_PYTHON_API_URL=${NEXT_PUBLIC_PYTHON_API_URL:-http://backend:8080}
      - SHEETSAGE_API_URL=${SHEETSAGE_API_URL:-http://sheetsage:8082}
      - SHEETSAGE_BACKEND_TIMEOUT_MS=${SHEETSAGE_BACKEND_TIMEOUT_MS:-600000}
      - STEMS_API_URL=${STEMS_API_URL:-http://stems:8083}
      - STEMS_BACKEND_TIMEOUT_MS=${STEMS_BACKEND_TIMEOUT_MS:-1800000}
      - STEMS_QUOTA_GB=${STEMS_QUOTA_GB:-10}
      - MUSIC_AI_API_KEY=${MUSIC_AI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GENIUS_API_KEY=${GENIUS_API_KEY:-}
      - CRON_SECRET=${CRON_SECRET:-replace_with_random_secret}
      - USE_MOCK_MUSIC_AI=${USE_MOCK_MUSIC_AI:-false}
    depends_on:
      backend:
        condition: service_healthy
      sheetsage:
        condition: service_healthy
      stems:
        condition: service_healthy
    networks:
      - chordmini-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/persistence/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend - Python Flask ML Service
  backend:
    build:
      context: ../python_backend
      dockerfile: Dockerfile
      target: runtime
    container_name: chordmini-backend
    expose:
      - "8080"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - FLASK_APP=app.py
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PRODUCTION_MODE=true
      - DEFAULT_BEAT_MODEL=beat-transformer
      - DEFAULT_CHORD_MODEL=chord-cnn-lstm
      - MAX_CONTENT_LENGTH=104857600
      - UPLOAD_TIMEOUT=600
      - STORAGE_AUDIO_DIR=/app/storage/audio
      # Model configuration
      - USE_BEAT_TRANSFORMER=true
      - USE_CHORD_CNN_LSTM=true
      - USE_BTC_SL=true
      - USE_BTC_PL=true
    volumes:
      # Mount shared audio directory for zero-copy local reading
      - frontend-audio:/app/storage/audio
      # Optional: Mount models directory for development
      # - ../python_backend/models:/app/models:ro
      # Mount cache directory for model caching
      - backend-cache:/tmp/model_cache
      - backend-logs:/app/logs
    networks:
      - chordmini-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s

  # SheetSage Backend - Melody & Pitch Transcription Service
  sheetsage:
    build:
      context: ../sheetsage
      dockerfile: Dockerfile
    container_name: chordmini-sheetsage
    expose:
      - "8082"
    environment:
      - PORT=8082
      - STORAGE_AUDIO_DIR=/app/storage/audio
      - SHEETSAGE_INTERNAL_AUDIO_HOSTS=frontend,localhost,127.0.0.1
      - SHEETSAGE_CACHE_DIR=/app/cache
      - SHEETSAGE_PRELOAD=false
      - PYTHONUNBUFFERED=1
    volumes:
      - frontend-audio:/app/storage/audio:ro
      - sheetsage-cache:/app/cache
    networks:
      - chordmini-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Stems - SCNet music source separation (vocals / drums / bass / other)
  stems:
    build:
      context: ../stems
      dockerfile: Dockerfile
    container_name: chordmini-stems
    gpus: all
    expose:
      - "8083"
    environment:
      - PORT=8083
      - STORAGE_AUDIO_DIR=/app/storage/audio
      - STEMS_CKPT_DIR=/app/ckpts
      - STEMS_MODEL=${STEMS_MODEL:-scnet_xl_ihf}
      - STEMS_DEVICE=${STEMS_DEVICE:-cuda}
      - STEMS_OVERLAP=${STEMS_OVERLAP:-2}
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - PYTHONUNBUFFERED=1
    volumes:
      # Reads source audio and writes stems/<sourceId>/*.flac into the shared audio volume
      - frontend-audio:/app/storage/audio
      - ../stems/ckpts:/app/ckpts:ro
    networks:
      - chordmini-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: chordmini-nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - chordmini-network
    restart: unless-stopped

networks:
  chordmini-network:
    driver: bridge

volumes:
  backend-cache:
    name: chordmini-backend-cache
  frontend-audio:
    name: chordmini-frontend-audio
    driver: local
  frontend-db:
    name: chordmini-frontend-db
    driver: local
  backend-logs:
    name: chordmini-backend-logs
    driver: local
  sheetsage-cache:
    name: chordmini-sheetsage-cache
    driver: local
