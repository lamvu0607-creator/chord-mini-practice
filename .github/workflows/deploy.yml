name: ChordMini CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write
  checks: write

jobs:
  # Pre-deployment validation job
  validate:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: TypeScript compilation check
      run: npx tsc --noEmit
      
    - name: ESLint check
      run: npm run lint

    - name: Unit tests
      run: npm run test:unit -- --runInBand

    - name: Integration tests
      run: npm run test:integration -- --runInBand
      
    - name: Build verification
      run: npm run build
      
    - name: Run pre-deployment checklist
      run: |
        chmod +x scripts/pre-deployment-checklist.sh
        ./scripts/pre-deployment-checklist.sh
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: .next/
        retention-days: 1

  test-review-gate:
    name: Test Change Review Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Check test approval label
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
      run: |
        CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
        TEST_RELATED_FILES=$(printf '%s\n' "$CHANGED_FILES" | grep -E '(^__tests__/|(^|/)[^/]+\.(test|spec)\.(ts|tsx)$|^jest\.config\.js$|^jest\.setup\.js$|^tsconfig\.test\.json$|^\.github/workflows/)' || true)

        if [ -z "$TEST_RELATED_FILES" ]; then
          echo "No test-related files changed."
          exit 0
        fi

        echo "Test-related files changed:"
        printf '%s\n' "$TEST_RELATED_FILES"

        if printf '%s' "$LABELS_JSON" | grep -q '"name"[[:space:]]*:[[:space:]]*"tests-approved"'; then
          echo "tests-approved label found."
          exit 0
        fi

        echo "Test-related changes require manual maintainer review."
        echo "Ask a maintainer to review the test changes and apply the tests-approved label."
        exit 1

  # Security scan job
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run security audit
      run: |
        npm audit --omit=dev --audit-level=high
        
    - name: Check for sensitive files
      run: |
        echo "Checking for sensitive files..."
        if find . -name "*.env" -o -name "*.key" -o -name "*secret*" -o -name "*credential*" | grep -v node_modules | grep -v .env.example; then
          echo "❌ Sensitive files found in repository!"
          exit 1
        else
          echo "✅ No sensitive files found"
        fi
        
    - name: Verify environment variables
      run: |
        echo "Checking environment variable configuration..."
        if [ ! -f ".env.example" ]; then
          echo "❌ .env.example file missing"
          exit 1
        fi
        echo "✅ Environment configuration verified"

  # Publish wiki pages from .qoder/repowiki to the GitHub Wiki repo
  publish-wiki:
    name: Publish Wiki
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure git identity
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Publish wiki pages
      env:
        WIKI_REPO_URL: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ptnghia-j/ChordMiniApp.wiki.git"
      run: |
        chmod +x scripts/publish-repowiki-to-github-wiki.sh
        ./scripts/publish-repowiki-to-github-wiki.sh
