<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>ChordMini is offline</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --fg: #0f172a; --muted: #475569; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #020617; --fg: #f1f5f9; --muted: #94a3b8; } }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
    }
    main { max-width: 360px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 1.35rem; margin: 20px 0 8px; }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
    button {
      min-height: 44px; padding: 0 24px; border: 0; border-radius: 999px;
      background: var(--accent); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="">
    <h1>The ChordMini server is off</h1>
    <p>The server is off right now. Please contact Lâm Vũ.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    // Come back by itself once the server is up again.
    setInterval(function () {
      fetch('/api/health', { cache: 'no-store' }).then(function (response) {
        if (response.ok) location.reload();
      }).catch(function () {});
    }, 30000);
  </script>
</body>
</html>
